{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>Site | Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #2c2c2c;
            margin: 0;
        }

        .site-text {
            color: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }
        
        body {
            background-color: #c9d6ff;
            background: linear-gradient(to right, #e2e2e2, #c9d6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
        }
        
        .container {
            background-color: #fff;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
            width: 768px;
            max-width: 100%;
            min-height: 480px;
        }
        
        .container p {
            font-size: 14px;
            line-height: 20px;
            letter-spacing: 0.3px;
            margin: 20px 0;
        }
        
        .container span {
            font-size: 12px;
        }
        
        .container a {
            color: #333;
            font-size: 13px;
            text-decoration: none;
            margin: 15px 0 10px;
        }
        
        .container button {
            background-color: #b14f93;
            color: #fff;
            font-size: 12px;
            padding: 10px 45px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
            cursor: pointer;
        }
        
        .container button.hidden {
            background-color: transparent;
            border-color: #fff;
        }
        
        .container form {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            height: 100%;
        }
        
        .container input {
            background-color: #eee;
            border: none;
            margin: 8px 0;
            padding: 10px 15px;
            font-size: 13px;
            border-radius: 8px;
            width: 100%;
            outline: none;
        }
        
        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }
        
        .sign-in {
            left: 0;
            width: 50%;
            z-index: 2;
        }
        
        .container.active .sign-in {
            transform: translateX(100%);
        }
        
        .sign-up {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }
        
        .container.active .sign-up {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: move 0.6s;
        }
        
        @keyframes move {
            0%, 49.99% {
                opacity: 0;
                z-index: 1;
            }
            50%, 100% {
                opacity: 1;
                z-index: 5;
            }
        }
        
        .social-icons {
            margin: 20px 0;
        }
        
        .social-icons a {
            border: 1px solid #ccc;
            border-radius: 20%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 3px;
            width: 40px;
            height: 40px;
        }
        
        .toggle-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: all 0.6s ease-in-out;
            border-radius: 150px 0 0 100px;
            z-index: 1000;
        }
        
        .container.active .toggle-container {
            transform: translateX(-100%);
            border-radius: 0 150px 100px 0;
        }
        
        .toggle {
            background-color: #512da8;
            height: 100%;
            background: linear-gradient(to right, #b14f9463, #b14f93);
            color: #fff;
            position: relative;
            left: -100%;
            width: 200%;
            transform: translateX(0);
            transition: all 0.6s ease-in-out;
        }
        
        .container.active .toggle {
            transform: translateX(50%);
        }
        
        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 30px;
            text-align: center;
            top: 0;
            transform: translateX(0);
            transition: all 0.6s ease-in-out;
        }
        
        .toggle-left {
            transform: translateX(-200%);
        }
        
        .container.active .toggle-left {
            transform: translateX(0);
        }
        
        .toggle-right {
            right: 0;
            transform: translateX(0);
        }
        
        .container.active .toggle-right {
            transform: translateX(200%);
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-auto-rows: 50px;
            gap: 5px;
            justify-content: center;
            margin-top: 20px;
        }

        .color-box {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgb(0, 0, 0);
            cursor: pointer;
        }

        .selected {
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form onsubmit="return false;">
                <div class="color-palette">
                    <div class="color-box" id="color1" style="background-color: #0088ff;"></div>
                    <div class="color-box" id="color2" style="background-color: #ff0000;"></div>
                    <div class="color-box" id="color3" style="background-color: #4ba745;"></div>
                    <div class="color-box" id="color4" style="background-color: #663399;"></div>
                    <div class="color-box" id="color5" style="background-color: #ffcc00;"></div>
                    <div class="color-box" id="color6" style="background-color: #6ab541;"></div>
                    <div class="color-box" id="color7" style="background-color: #0f97c7;"></div>
                    <div class="color-box" id="color8" style="background-color: #cd1482;"></div>
                    <div class="color-box" id="color9" style="background-color: #663300;"></div>
                    <div class="color-box" id="color10" style="background-color: #f2cb01;"></div>
                    <div class="color-box" id="color11" style="background-color: #0056a4;"></div>
                    <div class="color-box" id="color12" style="background-color: #009639;"></div>
                    <div class="color-box" id="color13" style="background-color: #ff671b;"></div>
                    <div class="color-box" id="color15" style="background-color: #ff5733;"></div>
                    <div class="color-box" id="color17" style="background-color: #800080;"></div>
                    <div class="color-box" id="color18" style="background-color: #000000;"></div>
                    <div class="color-box" id="color19" style="background-color: #2c3e50;"></div>
                    <div class="color-box" id="color20" style="background-color: #7f8c8d;"></div>
                    <div class="color-box" id="color21" style="background-color: #34495e;"></div>
                    <div class="color-box" id="color22" style="background-color: #9b59b6;"></div>
                    <div class="color-box" id="color23" style="background-color: #8e44ad;"></div>
                    <div class="color-box" id="color24" style="background-color: #3498db;"></div>
                    <div class="color-box" id="color25" style="background-color: #2980b9;"></div>
                    <div class="color-box" id="color26" style="background-color: #e74c3c;"></div>
                    <div class="color-box" id="color27" style="background-color: #c0392b;"></div>
                    <div class="color-box" id="color28" style="background-color: #7f8c8d;"></div>
                    <div class="color-box" id="color29" style="background-color: #27ae60;"></div>
                    <div class="color-box" id="color30" style="background-color: #d35400;"></div>
                    <div class="color-box" id="color31" style="background-color: #f39c12;"></div>
                    <div class="color-box" id="color32" style="background-color: #7a1464;"></div>               
                </div>
            </form>
        </div>

        <div class="form-container sign-in">
            <form action="{% url 'verification' %}" method="post">
                {% csrf_token %}
                <h1 class="site-text">SITE</h1>
                <div class="social-icons"></div>
                <span></span>
                <input type="text" name="usuario" placeholder="Usuario" maxlength="12" required>
                <input type="password" name="password" placeholder="Contraseña" maxlength="12" required>
                <button type="submit">ENTRAR</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Hola! En este apartado tienes la posibilidad de cambiar el color del sistema</h1>
                    <p>Elije el que mas te guste</p>
                    <button class="hidden" id="login">Regresar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h2>SISTEMA DE TECNOLOGIA ELECTORAL</h2>
                    <p>COPYRIGHT© DERECHOS RESERVADOS</p>
                    <img src="{% static 'images/logo.png' %}" alt="Logo" width="240" height="240">
                </div>
            </div>
        </div>
    </div>

    <!-- Si tienes un script.js en static, se llama así: -->
    <!-- <script src="{% static 'script.js' %}"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    {% if error %}
    <script>
        Swal.fire({
            title: 'Usuario o contraseña incorrectos',
            text: 'Por favor, verifica tus datos e intenta de nuevo.',
            icon: 'error',
            confirmButtonText: 'Aceptar'
        });
    </script>
    {% endif %}

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('container');
            const registerBtn = document.getElementById('register');
            const loginBtn = document.getElementById('login');

            // Validación segura por si los botones existen o no
            if (registerBtn) {
                registerBtn.addEventListener('click', () => {
                    container.classList.add("active");
                });
            }

            if (loginBtn) {
                loginBtn.addEventListener('click', () => {
                    container.classList.remove("active");
                });
            }

            const colorBoxes = document.querySelectorAll('.color-box');
            const elementsToColor = document.querySelectorAll('.menu__container, .toggle, .container button, .custom-table th, .menu__links, .menu__hamburguer, .menu, .btn-agregar, #botones-fila button, .menu__nesting');
            const toggleElement = document.querySelector('.toggle');

            function getColorFromLocalStorage() {
                return localStorage.getItem('selectedColor');
            }

            function setColorToLocalStorage(color) {
                localStorage.setItem('selectedColor', color);
            }

            function updateGradient(color) {
                if (toggleElement && color) {
                    toggleElement.style.background = `linear-gradient(to right, ${color}63, ${color})`;
                }
            }

            function applyColor(selectedColor) {
                if (!selectedColor) return;
                elementsToColor.forEach(element => {
                    element.style.backgroundColor = selectedColor;
                });
                updateGradient(selectedColor);
            }

            colorBoxes.forEach(colorBox => {
                colorBox.addEventListener('click', () => {
                    colorBoxes.forEach(box => box.classList.remove('selected'));
                    colorBox.classList.add('selected');
                    const selectedColor = colorBox.style.backgroundColor;
                    setColorToLocalStorage(selectedColor);
                    applyColor(selectedColor);
                });
            });

            // Al cargar la página recuperar color de localStorage
            const savedColor = getColorFromLocalStorage();
            if (savedColor) {
                applyColor(savedColor);
                colorBoxes.forEach(colorBox => {
                    if (colorBox.style.backgroundColor === savedColor) {
                        colorBox.classList.add('selected');
                    }
                });
            }
        });
    </script>
</body>
</html>
