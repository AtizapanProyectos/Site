    const getOptionChart3 = (values) => {
    const categories = ["Total de Actas", "Actas de Cotejo", "Actas Cotejadas", "Actas de Recuento", "Actas Recontadas"];

    return {
        tooltip: {
            show: true
        },
        xAxis: {
            type: "category",
            data: categories,
            axisLabel: {
                interval: 0,
                rotate: 0,
                margin: 10
            }
        },
        yAxis: {
            type: "value"
        },
        series: [
            {
                data: values,
                type: "bar",
                label: {
                    show: true,
                    position: 'top'
                },
                itemStyle: {
                    normal: {
                        borderWidth: 2,
                        borderColor: 'white', // Cambiar el color del borde a blanco
                        color: function(params) {
                            if (params.dataIndex === 0) {
                                return '#FFFFFF'; // Cambiar el color de la primera barra a blanco
                            } else if (params.dataIndex <= 2) {
                                return '#91CC75';
                            } else {
                                return '#5470C6';
                            }
                        }
                    }
                }
            }
        ]
    };
};

const getOptionChart4 = (cotejo, recuento) => {
    let data = [];

    // Verificar si ambos parámetros son 0
    if (cotejo === 0 && recuento === 0) {
        // Si ambos son 0, dibujar toda la gráfica en gris
        data = [
            { value: 1, name: "Sin datos", itemStyle: { color: "gray" } }
        ];
    } else {
        // Si al menos uno de los parámetros es diferente de 0, dibujar la gráfica normalmente
        data = [
            { value: recuento, name: "Actas de Recuento" },
            { value: cotejo, name: "Actas de Cotejo" }
        ];
    }

    return {
        tooltip: {
            trigger: "item",
            formatter: "{a} <br/>{b}: {c} ({d}%)"
        },
        legend: {
            top: "5%",
            left: "center"
        },
        series: [
            {
                name: "Total",
                type: "pie",
                radius: ["40%", "70%"],
                avoidLabelOverlap: false,
                itemStyle: {
                    borderRadius: 5,
                    borderColor: "#fff",
                    borderWidth: 2
                },
                label: {
                    show: true,
                    position: "outside",
                    formatter: "{d}%"
                },
                emphasis: {
                    label: {
                        show: true,
                        fontSize: "20",
                        fontWeight: "bold"
                    }
                },
                labelLine: {
                    show: true
                },
                data: data
            }
        ]
    };
};
